
name: Greenwheels CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint, Test and Docker Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t greenwheels-api:ci .

      - name: Start API container
        run: |
          docker run -d \
            --name greenwheels-api-ci \
            -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci \
            greenwheels-api:ci

      - name: Verify API health within 10 seconds
        run: |
          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API health check passed."
              exit 0
            fi
            sleep 1
          done

          echo "API did not become healthy within 10 seconds."
          docker logs greenwheels-api-ci
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f greenwheels-api-ci || true

  publish:
    name: Publish Docker Image to GHCR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
