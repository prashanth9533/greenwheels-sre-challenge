
groups:
  - name: greenwheels-sre-alerts
    rules:
      - alert: HighLeaseEventErrorRate
        expr: |
          (
            sum(rate(http_requests_total{
              route="/leases/events",
              status=~"5.."
            }[5m]))
            /
            clamp_min(
              sum(rate(http_requests_total{
                route="/leases/events"
              }[5m])),
              0.001
            )
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "High lease event API error rate"
          description: "More than 5% of lease event requests are failing with 5xx errors for 5 minutes."
          runbook_url: "https://github.com/prashanth9533/greenwheels-sre-challenge/blob/main/RUNBOOK.md"

      - alert: HighAPILatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                route=~"/leases.*"
              }[5m])
            )
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High API p95 latency"
          description: "The p95 latency of lease API requests has exceeded 300 milliseconds for 5 minutes."
          runbook_url: "https://github.com/prashanth9533/greenwheels-sre-challenge/blob/main/RUNBOOK.md"

      - alert: FastAPIServiceDown
        expr: up{job="greenwheels-fastapi"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Greenwheels FastAPI service is down"
          description: "Prometheus cannot scrape the Greenwheels FastAPI metrics endpoint."
          runbook_url: "https://github.com/prashanth9533/greenwheels-sre-challenge/blob/main/RUNBOOK.md"


      - alert: GreenwheelsEmailTest
        expr: vector(1)
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Greenwheels Gmail notification test"
          description: "Testing Alertmanager email delivery."    
